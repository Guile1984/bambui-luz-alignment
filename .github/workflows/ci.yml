name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash -el {0}

jobs:
  qualidade:
    name: Lint e testes
    runs-on: ubuntu-latest

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Montar ambiente conda
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Instalar o pacote
        run: pip install -e . --no-deps

      - name: Verificar lint
        run: ruff check .

      - name: Verificar formatacao
        run: ruff format --check .

      - name: Executar testes
        run: pytest
