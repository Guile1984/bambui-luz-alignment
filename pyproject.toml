[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bambui-luz-alignment"
version = "0.1.0"
description = "Estudo comparativo de alternativas de traçado rodoviário entre Bambuí e Luz (MG)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Guilherme" }]
keywords = ["engenharia-civil", "gis", "rodovias", "terraplenagem"]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/bambui_luz"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN", "D", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
